<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#10172b">
  <title>Thank You | Shaida Muhammad Sherpao</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#60708a; --line:#e4e8f1; --surface:#fff; --page:#f7f8fc; --primary:#5b5cf0; --accent:#10bfa5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:radial-gradient(circle at top right,rgba(91,92,240,.13),transparent 35%),var(--page); }
    main { width:min(100%,600px); padding:clamp(28px,6vw,52px); border:1px solid var(--line); border-radius:24px; background:var(--surface); box-shadow:0 18px 50px rgba(24,35,69,.1); text-align:center; }
    .icon { display:grid; place-items:center; width:64px; height:64px; margin:0 auto 20px; border-radius:20px; color:#087d6e; background:#e0faf4; font-size:32px; font-weight:800; }
    h1 { margin:0 0 12px; font-size:clamp(1.8rem,6vw,2.5rem); line-height:1.15; letter-spacing:-.04em; }
    p { color:var(--muted); margin:0 0 24px; }
    a { display:inline-flex; align-items:center; justify-content:center; padding:12px 18px; border-radius:12px; color:#fff; background:var(--primary); text-decoration:none; font-weight:750; }
    a:hover { filter:brightness(.95); }
    small { display:block; margin-top:24px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">✓</div>
    <h1>Thank you for your message</h1>
    <p>Your message has been submitted. Thank you for getting in touch; I’ll review it and reply by email when possible.</p>
    <a href="https://shaidamuhammad.github.io/">Return to portfolio</a>
    <small>Shaida Muhammad Sherpao · Machine Learning Engineer</small>
  </main>
</body>
</html>
